<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA - VINTAGE BLACK METAL</title>

<style>
  /* 1. SCROLLBAR USANG */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #050505; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; border: 1px solid #000; }
  
  /* 2. BODY: HITAM DOFF DENGAN GRAIN TEXTURE */
  body {
    margin: 0; padding: 0;
    background-color: #0a0a0a; /* Hitam Doff */
    /* Tekstur Grain/Noise Vintage */
    background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); 
    background-attachment: fixed;
    color: #d1d1d1; /* Putih pudar (off-white) agar tidak terlalu kontras */
    font-family: 'Georgia', serif; /* Font klasik tajam */
    text-align: center;
    overflow-x: hidden;
  }

  /* Efek Vignette (Garis Gelap di Pinggiran) */
  body::before {
    content: "";
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
    pointer-events: none; z-index: 10;
  }

  /* 3. HEADER LOGO */
  .logo-header { 
    padding: 20px 0;
    position: sticky; top: 0; 
    background: rgba(10,10,10,0.95); 
    backdrop-filter: blur(5px);
    z-index: 900;
    border-bottom: 1px solid #1a1a1a;
  }
  .logo-header img { 
    max-width: 240px; width: 60%; height: auto; 
    filter: sepia(0.3) grayscale(0.5); /* Efek logo agak usang */
  }

  /* 4. MAIN LANDING */
  #main-landing { padding: 50px 20px; position: relative; z-index: 5; }
  
  .hero-img {
    max-width: 450px; width: 90%;
    border: 1px solid #1a1a1a;
    filter: grayscale(0.2) contrast(1.1); /* Efek foto lebih kontras & dingin */
    cursor: pointer;
    transition: 0.5s;
  }
  .hero-img:hover { border-color: #444; filter: grayscale(0); }

  .price-tag { margin-top: 35px; }
  .price-idr { 
    font-size: 26px; font-weight: normal; 
    letter-spacing: 10px; display: block; 
    text-transform: uppercase; 
  }

  /* 5. TOMBOL CHECK OUT */
  .btn-wa {
    display: inline-block;
    margin-top: 40px;
    background: transparent;
    color: #888;
    padding: 12px 50px;
    text-decoration: none;
    border: 1px solid #222;
    font-size: 10px;
    letter-spacing: 6px;
    text-transform: uppercase;
    transition: 0.4s;
  }
  .btn-wa:hover { 
    color: #fff; 
    border-color: #fff; 
    background: rgba(255,255,255,0.02);
  }

  .explore-btn {
    display: block; font-size: 8px; color: #333; margin-top: 45px; 
    letter-spacing: 12px; cursor: pointer; transition: 0.3s;
  }
  .explore-btn:hover { color: #666; }

  /* 6. DETAIL GRID */
  #detail-grid {
    display: none; grid-template-columns: repeat(2, 1fr);
    gap: 15px; padding: 15px; max-width: 900px; margin: 0 auto;
    z-index: 5; position: relative;
  }
  .btn-back {
    display: none; background: none; border: none; color: #444; 
    padding: 20px; font-size: 9px; letter-spacing: 6px; cursor: pointer;
    z-index: 20; position: relative;
  }

  .product-card { background: #000; border: 1px solid #111; padding: 5px; cursor: pointer; }
  .product-card img { width: 100%; filter: grayscale(0.5); }
  .product-card:hover img { filter: grayscale(0); }

  /* 7. VIEWER */
  #viewer {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: #000; z-index: 10000;
  }
  #imgView { max-width: 85%; max-height: 80vh; transition: transform 0.1s; }
  .ui-btn { position: fixed; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; z-index: 10001; padding: 20px; opacity: 0.3; }
  .ui-btn:hover { opacity: 1; }
  .close-x { top: 10px; right: 10px; }
  .arrow-l { left: 0; top: 50%; transform: translateY(-50%); }
  .arrow-r { right: 0; top: 50%; transform: translateY(-50%); }

  @media (max-width: 500px) { #detail-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="logo-header">
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<div id="main-landing">
  <img src="kaos_depan.jpg" class="hero-img" onclick="goToDetails()">
  
  <div class="price-tag">
    <span class="price-idr">IDR 165.000</span>
  </div>

  <a href="https://wa.me/6282137358827?text=Saya%20mau%20beli%20merchandise%20Antisia" class="btn-wa" target="_blank">
    CHECK OUT
  </a>

  <span class="explore-btn" onclick="goToDetails()">[ EXPLORE ]</span>
</div>

<button class="btn-back" id="btnBack" onclick="goBack()">RETURN TO GALLERY</button>
<div id="detail-grid">
  <div class="product-card" onclick="openViewer(0)"><img src="kaos_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(1)"><img src="kaos_belakang.jpg"></div>
  <div class="product-card" onclick="openViewer(2)"><img src="model_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(3)"><img src="model_belakang.jpg"></div>
</div>

<div id="viewer">
  <button class="ui-btn close-x" onclick="closeViewer()">✕</button>
  <button class="ui-btn arrow-l" onclick="prevImg()">‹</button>
  <button class="ui-btn arrow-r" onclick="nextImg()">›</button>
  <div class="viewer-wrap" id="dropzone" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
    <img id="imgView" src="">
  </div>
</div>

<script>
  // Logika navigasi kawan
  const imgs = ["kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg"];
  let currentIndex = 0;
  let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0, isDragging = false;

  function goToDetails() {
    document.getElementById('main-landing').style.display = 'none';
    document.getElementById('detail-grid').style.display = 'grid';
    document.getElementById('btnBack').style.display = 'inline-block';
    window.scrollTo(0,0);
  }

  function goBack() {
    document.getElementById('main-landing').style.display = 'block';
    document.getElementById('detail-grid').style.display = 'none';
    document.getElementById('btnBack').style.display = 'none';
  }

  function openViewer(index) {
    currentIndex = index;
    document.getElementById("viewer").style.display = "block";
    updateContent();
    document.body.style.overflow = "hidden";
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.body.style.overflow = "auto";
  }

  function updateContent() {
    scale = 1; pointX = 0; pointY = 0;
    document.getElementById("imgView").src = imgs[currentIndex];
    updateTransform();
  }

  function nextImg() { currentIndex = (currentIndex + 1) % imgs.length; updateContent(); }
  function prevImg() { currentIndex = (currentIndex - 1 + imgs.length) % imgs.length; updateContent(); }

  function updateTransform() {
    document.getElementById("imgView").style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
  }

  // Zoom wheel logic kawan
  const viewer = document.getElementById("viewer");
  viewer.onwheel = function(e) {
    e.preventDefault();
    if (e.deltaY > 0) scale = Math.max(1, scale - 0.2);
    else scale = Math.min(5, scale + 0.2);
    updateTransform();
  }
</script>

</body>
</html>
