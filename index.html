<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE - OFFICIAL</title>

<style>
  /* 1. STYLING DASAR & SCROLLBAR */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #333; }
  
  body {
    margin: 0; padding: 0;
    background-color: #000;
    background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); 
    background-attachment: fixed;
    color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
  }

  /* 2. HEADER LOGO RAMPING */
  .logo-header { 
    padding: 12px 20px;
    position: sticky; 
    top: 0; 
    background: rgba(0,0,0,0.85); 
    backdrop-filter: blur(10px);
    z-index: 900;
    border-bottom: 1px solid #1a1a1a;
  }
  .logo-header img { 
    max-width: 250px;
    width: 65%;
    height: auto; 
    display: block;
    margin: 0 auto;
  }

  /* 3. HALAMAN 1: MAIN LANDING */
  #main-landing { padding: 30px 20px 70px 20px; }
  .hero-img {
    max-width: 480px; width: 90%;
    border: 1px solid #222;
    cursor: pointer; /* Memberi tanda bisa diklik */
    transition: 0.3s;
  }
  .hero-img:hover { border-color: #ff0000; transform: scale(1.01); }

  .price-tag { margin-top: 20px; }
  .price-idr { font-size: 26px; font-weight: 900; letter-spacing: 2px; display: block; }
  .price-usd { font-size: 14px; color: #555; display: block; margin-top: 4px; }

  .btn-wa {
    display: inline-block;
    margin-top: 25px;
    background-color: #ff0000;
    color: #fff;
    padding: 15px 40px;
    text-decoration: none;
    font-weight: bold;
    letter-spacing: 3px;
    transition: 0.4s;
    border: 1px solid #ff0000;
    font-size: 13px;
  }
  .btn-wa:hover { background: transparent; color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.3); }

  .explore-btn {
    display: block;
    font-size: 10px; 
    color: #444; 
    margin-top: 25px; 
    letter-spacing: 5px; 
    cursor: pointer; 
    text-transform: uppercase;
    transition: 0.3s;
  }
  .explore-btn:hover { color: #fff; }

  /* 4. HALAMAN 2: DETAIL GRID */
  #detail-grid {
    display: none;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px; padding: 15px;
    max-width: 900px; margin: 0 auto;
  }
  .btn-back {
    display: none; background: #0a0a0a; border: 1px solid #222;
    color: #666; padding: 10px 20px; cursor: pointer;
    margin: 15px 0; font-size: 10px; letter-spacing: 2px;
  }

  .product-card { background: rgba(10,10,10,0.8); border: 1px solid #1a1a1a; padding: 8px; cursor: pointer; }
  .product-card img { width: 100%; display: block; }
  .product-card p { font-size: 9px; color: #444; margin-top: 8px; }

  /* 5. POPUP VIEWER */
  #viewer {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.98);
    z-index: 10000; overflow: hidden; touch-action: none;
  }
  .viewer-wrap { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: grab; }
  #imgView { max-width: 85%; max-height: 85vh; transition: transform 0.1s ease-out; transform-origin: center; }
  .ui-btn { position: fixed; background: none; border: none; color: #fff; font-size: 35px; cursor: pointer; z-index: 10001; padding: 15px; opacity: 0.5; }
  .ui-btn:hover { opacity: 1; }
  .close-x { top: 10px; right: 10px; }
  .arrow-l { left: 0; top: 50%; transform: translateY(-50%); }
  .arrow-r { right: 0; top: 50%; transform: translateY(-50%); }

  @media (max-width: 500px) { #detail-grid { grid-template-columns: 1fr; } .logo-header img { max-width: 180px; } }
</style>
</head>
<body>

<div class="logo-header">
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<!-- HALAMAN 1 -->
<div id="main-landing">
  <!-- Gambar Depan SEKARANG BISA DIKLIK kawan -->
  <img src="kaos_depan.jpg" class="hero-img" onclick="goToDetails()">
  
  <div class="price-tag">
    <span class="price-idr">IDR 165.000</span>
    <span class="price-usd">11$ USD</span>
  </div>

  <!-- NOMOR HP SUDAH DIPERBAHARUI kawan -->
  <a href="https://wa.me/6282137358827?text=Saya%20mau%20beli%20merchandise%20Antisia" class="btn-wa" target="_blank">
    ORDER NOW
  </a>

  <!-- TEXT EXPLORE SEKARANG BISA DIKLIK kawan -->
  <span class="explore-btn" onclick="goToDetails()">EXPLORE DETAILS</span>
</div>

<!-- HALAMAN 2 -->
<button class="btn-back" id="btnBack" onclick="goBack()">◀ BACK TO SELECTION</button>
<div id="detail-grid">
  <div class="product-card" onclick="openViewer(0)"><img src="kaos_depan.jpg"><p>FRONT ARTICLE</p></div>
  <div class="product-card" onclick="openViewer(1)"><img src="kaos_belakang.jpg"><p>BACK ARTICLE</p></div>
  <div class="product-card" onclick="openViewer(2)"><img src="model_depan.jpg"><p>LOOKBOOK 01</p></div>
  <div class="product-card" onclick="openViewer(3)"><img src="model_belakang.jpg"><p>LOOKBOOK 02</p></div>
</div>

<!-- POPUP ZOOM -->
<div id="viewer">
  <button class="ui-btn close-x" onclick="closeViewer()">✕</button>
  <button class="ui-btn arrow-l" onclick="prevImg()">‹</button>
  <button class="ui-btn arrow-r" onclick="nextImg()">›</button>
  <div class="viewer-wrap" id="dropzone">
    <img id="imgView" src="">
  </div>
</div>

<script>
  const imgs = ["kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg"];
  let currentIndex = 0;
  let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0, isDragging = false;

  function goToDetails() {
    document.getElementById('main-landing').style.display = 'none';
    document.getElementById('detail-grid').style.display = 'grid';
    document.getElementById('btnBack').style.display = 'inline-block';
    window.scrollTo(0,0);
  }

  function goBack() {
    document.getElementById('main-landing').style.display = 'block';
    document.getElementById('detail-grid').style.display = 'none';
    document.getElementById('btnBack').style.display = 'none';
  }

  function openViewer(index) {
    currentIndex = index;
    document.getElementById("viewer").style.display = "block";
    updateContent();
    document.body.style.overflow = "hidden";
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.body.style.overflow = "auto";
  }

  function updateContent() {
    scale = 1; pointX = 0; pointY = 0;
    document.getElementById("imgView").src = imgs[currentIndex];
    updateTransform();
  }

  function nextImg() { currentIndex = (currentIndex + 1) % imgs.length; updateContent(); }
  function prevImg() { currentIndex = (currentIndex - 1 + imgs.length) % imgs.length; updateContent(); }

  function updateTransform() {
    document.getElementById("imgView").style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
  }

  const viewer = document.getElementById("viewer");
  viewer.onwheel = function(e) {
    e.preventDefault();
    if (e.deltaY > 0) scale = Math.max(1, scale - 0.2);
    else scale = Math.min(5, scale + 0.2);
    updateTransform();
  }

  const dropzone = document.getElementById("dropzone");
  dropzone.onmousedown = function(e) {
    isDragging = true;
    startX = e.clientX - pointX;
    startY = e.clientY - pointY;
  }
  window.onmousemove = function(e) {
    if (!isDragging) return;
    pointX = e.clientX - startX;
    pointY = e.clientY - startY;
    updateTransform();
  }
  window.onmouseup = function() { isDragging = false; }
</script>

</body>
</html>
