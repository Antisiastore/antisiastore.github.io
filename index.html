<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
  body {
    margin: 0;
    background: #0d0d0d;
    color: white;
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* --- BAGIAN LOGO --- */
  .logo-header {
    padding: 40px 20px;
    display: flex;
    justify-content: center; /* Menaruh logo di tengah secara horizontal */
    align-items: center;
  }

  .logo-header img {
    max-width: 280px; /* Ukuran lebar logo (bisa kamu ubah sesukamu) */
    height: auto;    /* Menjaga agar logo tidak gepeng */
    display: block;
  }

  /* --- BAGIAN GRID PRODUK --- */
  .grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 20px;
  }

  .card {
    background: #1a1a1a;
    padding: 15px;
    border-radius: 12px;
    width: 90%;
    max-width: 320px;
  }

  .card img {
    width: 100%;
    border-radius: 10px;
    cursor: pointer;
  }

  .card p {
    margin-top: 10px;
    font-size: 14px;
    color: #aaa;
  }

  /* --- VIEWER (SAAT GAMBAR DIKLIK) --- */
  #viewer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 999;
  }

  .viewer-wrap {
    width: 100%;
    height: 100%;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .viewer-wrap img {
    max-width: 95%;
    max-height: 90vh;
  }

  .nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 30px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    padding: 10px;
  }

  .left { left: 10px; }
  .right { right: 10px; }

  .close {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 35px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- HEADER DENGAN LOGO ANTISIA -->
<div class="logo-header">
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<div class="grid">
  <div class="card">
    <img src="kaos_depan.jpg" onclick="openViewer(0)">
    <p>Kaos Depan</p>
  </div>

  <div class="card">
    <img src="kaos_belakang.jpg" onclick="openViewer(1)">
    <p>Kaos Belakang</p>
  </div>

  <div class="card">
    <img src="model_depan.jpg" onclick="openViewer(2)">
    <p>Model Depan</p>
  </div>

  <div class="card">
    <img src="model_belakang.jpg" onclick="openViewer(3)">
    <p>Model Belakang</p>
  </div>

  <div class="card">
    <img src="detail.jpg" onclick="openViewer(4)">
    <p>Detail Produk</p>
  </div>
</div>

<!-- TEMPAT VIEWER GAMBAR -->
<div id="viewer">
  <button class="close" onclick="closeViewer()">✕</button>
  <button class="nav left" onclick="prev()">◀</button>
  <button class="nav right" onclick="next()">▶</button>
  <div class="viewer-wrap">
    <img id="imgView">
  </div>
</div>

<script>
  // Array gambar untuk navigasi viewer
  let imgs = [
    "kaos_depan.jpg",
    "kaos_belakang.jpg",
    "model_depan.jpg",
    "model_belakang.jpg",
    "detail.jpg"
  ];

  let i = 0;

  function openViewer(n) {
    i = n;
    document.getElementById("viewer").style.display = "block";
    show();
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
  }

  function show() {
    document.getElementById("imgView").src = imgs[i];
  }

  function next() {
    i = (i + 1) % imgs.length;
    show();
  }

  function prev() {
    i = (i - 1 + imgs.length) % imgs.length;
    show();
  }
</script>

</body>
</html>
