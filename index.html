<!DOCTYPE html>
<html>
<head>
    <title>Toko Acep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
#viewer {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  flex-direction: column;
  z-index:999;
}

#viewer img {
  max-width:80vw;
  max-height:80vh;
  transition: transform 0.2s;
}

.nav {
  position:absolute;
  top:50%;
  transform: translateY(-50%);
  font-size:40px;
  background:none;
  color:white;
  border:none;
  cursor:pointer;
}

.left { left:20px; }
.right { right:20px; }

.close {
  position:absolute;
  top:20px;
  right:20px;
  font-size:30px;
  cursor:pointer;
}

.controls {
  margin-top:15px;
}

.produk-img {
  cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h1>TOKO ACEP SURYA</h1>

<form method="GET">
    <input type="text" name="q" placeholder="Cari produk...">
    
    <select name="kategori">
        <option value="">Semua</option>
        <option value="kaos">Kaos</option>
        <option value="hoodie">Hoodie</option>
    </select>

    <button type="submit">Cari</button>
</form>

<div class="grid">

{% for p in produk %}
<div class="card">
    <img src="{{ url_for('static', filename=p.gambar[0]) }}"
         onclick="openViewer({{ loop.index0 }})"
         class="produk-img">
    
    <h3>{{ p.nama }}</h3>
    <p>{{ p.harga }}</p>

    <a href="/produk/{{ p.id }}">Lihat</a>
</div>
{% endfor %}

</div>

</div>

<!-- DATA GAMBAR -->
<script>
let images = [
{% for p in produk %}
"{{ url_for('static', filename=p.gambar[0]) }}",
{% endfor %}
];
</script>

<!-- POPUP VIEWER -->
<div id="viewer">
    <span class="close" onclick="closeViewer()">✕</span>

    <button class="nav left" onclick="prevImage()">◀</button>

    <img id="viewerImg">

    <button class="nav right" onclick="nextImage()">▶</button>

    <div class="controls">
        <button onclick="zoomIn()">+</button>
        <button onclick="zoomOut()">-</button>
        <button onclick="resetZoom()">RESET</button>
    </div>
</div>

<script>
let currentIndex = 0;
let scale = 1;

function openViewer(index){
  currentIndex = index;
  document.getElementById("viewer").style.display = "flex";
  showImage();
}

function closeViewer(){
  document.getElementById("viewer").style.display = "none";
}

function showImage(){
  let img = document.getElementById("viewerImg");
  img.src = images[currentIndex];
  scale = 1;
  updateZoom();
}

function nextImage(){
  currentIndex = (currentIndex + 1) % images.length;
  showImage();
}

function prevImage(){
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  showImage();
}

function zoomIn(){
  scale += 0.2;
  updateZoom();
}

function zoomOut(){
  scale -= 0.2;
  if(scale < 1) scale = 1;
  updateZoom();
}

function resetZoom(){
  scale = 1;
  updateZoom();
}

function updateZoom(){
  document.getElementById("viewerImg").style.transform =
    "scale(" + scale + ")";
}

// SCROLL ZOOM
document.getElementById("viewerImg").addEventListener("wheel", function(e){
  e.preventDefault();
  if(e.deltaY < 0){
    zoomIn();
  } else {
    zoomOut();
  }
});
</script>

</body>
</html>
