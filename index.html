<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
  body {
    margin: 0;
    background: #000000; /* Hitam pekat agar menyatu */
    color: white;
    text-align: center;
    font-family: 'Courier New', Courier, monospace; /* Nuansa industrial */
  }

  /* --- BAGIAN LOGO --- */
  .logo-header {
    padding: 50px 20px;
    display: flex;
    justify-content: center;
    background: #000;
  }

  .logo-header img {
    max-width: 300px;
    height: auto;
    display: block;
    
    /* TRICK: Menghapus putih dan menajamkan warna merah */
    /* Kita gunakan 'screen' dan filter contrast tinggi */
    mix-blend-mode: screen;
    filter: contrast(120%) brightness(110%);
  }

  /* --- GRID PRODUK --- */
  .grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    padding: 20px;
  }

  .card {
    background: #111111;
    padding: 15px;
    border: 1px solid #333; /* Border tipis industrial */
    border-radius: 0px; /* Siku-siku agar terasa lebih tegas */
    width: 90%;
    max-width: 350px;
  }

  .card img {
    width: 100%;
    filter: grayscale(20%); /* Sedikit gaya vintage */
    cursor: pointer;
    display: block;
  }

  .card p {
    margin-top: 15px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888;
  }

  /* --- VIEWER --- */
  #viewer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.98);
    z-index: 999;
  }

  .viewer-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .viewer-wrap img {
    max-width: 95%;
    max-height: 85vh;
    border: 1px solid #444;
  }

  .nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
  }

  .left { left: 10px; }
  .right { right: 10px; }

  .close {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 40px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="logo-header">
  <!-- Pastikan file logo_antisia.png ada di folder yang sama -->
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<div class="grid">
  <div class="card">
    <img src="kaos_depan.jpg" onclick="openViewer(0)">
    <p>Front Side</p>
  </div>

  <div class="card">
    <img src="kaos_belakang.jpg" onclick="openViewer(1)">
    <p>Back Side</p>
  </div>

  <div class="card">
    <img src="model_depan.jpg" onclick="openViewer(2)">
    <p>In-Frame Front</p>
  </div>

  <div class="card">
    <img src="model_belakang.jpg" onclick="openViewer(3)">
    <p>In-Frame Back</p>
  </div>

  <div class="card">
    <img src="detail.jpg" onclick="openViewer(4)">
    <p>Product Detail</p>
  </div>
</div>

<div id="viewer">
  <button class="close" onclick="closeViewer()">✕</button>
  <button class="nav left" onclick="prev()">◀</button>
  <button class="nav right" onclick="next()">▶</button>
  <div class="viewer-wrap">
    <img id="imgView">
  </div>
</div>

<script>
  let imgs = [
    "kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg", "detail.jpg"
  ];
  let i = 0;

  function openViewer(n) {
    i = n;
    document.getElementById("viewer").style.display = "block";
    show();
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
  }

  function show() {
    document.getElementById("imgView").src = imgs[i];
  }

  function next() {
    i = (i + 1) % imgs.length;
    show();
  }

  function prev() {
    i = (i - 1 + imgs.length) % imgs.length;
    show();
  }
</script>

</body>
</html>
