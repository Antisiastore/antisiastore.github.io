<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA - DARK ELEGANCE PRO</title>

<style>
  /* 1. CUSTOM CURSOR (Biar makin eksklusif) */
  * { cursor: none; } /* Hilangkan kursor asli */
  #custom-cursor {
    width: 8px; height: 8px; background: #ff0000;
    border-radius: 50%; position: fixed; 
    pointer-events: none; z-index: 99999;
    box-shadow: 0 0 10px #ff0000;
  }

  /* 2. ATMOSPHERE & BACKGROUND */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; }

  body {
    margin: 0; padding: 0;
    background: radial-gradient(circle, #0d0d0d 0%, #000 100%);
    background-attachment: fixed;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    text-align: center;
    overflow-x: hidden;
  }

  /* 3. LOGO HEADER */
  .logo-header { 
    padding: 15px 0;
    position: sticky; top: 0; 
    background: rgba(0,0,0,0.9); 
    backdrop-filter: blur(10px);
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .logo-header img { max-width: 200px; width: 50%; height: auto; }

  /* 4. HERO SECTION - IMAGE SWAP */
  #main-landing { padding: 40px 20px; animation: fadeIn 2s forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .hero-container {
    position: relative;
    max-width: 450px; margin: 0 auto;
    overflow: hidden;
    border: 1px solid #111;
  }
  .hero-img { width: 100%; transition: 0.8s ease; display: block; }
  .hero-img-back {
    position: absolute; top: 0; left: 0;
    width: 100%; opacity: 0; transition: 0.8s ease;
  }
  /* Efek Tukar Gambar Saat Hover */
  .hero-container:hover .hero-img { opacity: 0; transform: scale(1.05); }
  .hero-container:hover .hero-img-back { opacity: 1; transform: scale(1.05); }

  /* 5. TYPOGRAPHY & BUTTONS */
  .price-tag { margin-top: 30px; }
  .price-idr { font-size: 24px; letter-spacing: 8px; display: block; }
  
  .btn-wa {
    display: inline-block;
    margin-top: 40px;
    background: transparent; color: #fff;
    padding: 15px 45px; text-decoration: none;
    border: 1px solid #333; font-size: 11px;
    letter-spacing: 5px; transition: 0.4s;
  }
  .btn-wa:hover { background: #fff; color: #000; border-color: #fff; }

  /* ... Siswa Grid & Viewer tetap sama seperti sebelumnya ... */
  #detail-grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 20px; max-width: 900px; margin: 0 auto; }
  .btn-back { display: none; background: none; border: none; color: #444; padding: 20px; font-size: 9px; letter-spacing: 5px; cursor: pointer; }
  .product-card { background: #000; border: 1px solid #111; padding: 5px; cursor: pointer; }
  .product-card img { width: 100%; filter: grayscale(100%); transition: 0.5s; }
  .product-card:hover img { filter: grayscale(0%); }

  #viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; }
  #imgView { max-width: 85%; max-height: 80vh; transition: transform 0.1s; }
</style>
</head>
<body>

<div id="custom-cursor"></div>

<div class="logo-header">
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<div id="main-landing">
  <div class="hero-container" onclick="goToDetails()">
    <img src="kaos_depan.jpg" class="hero-img">
    <img src="kaos_belakang.jpg" class="hero-img-back"> <!-- Gambar belakang muncul pas hover -->
  </div>
  
  <div class="price-tag">
    <span class="price-idr">IDR 165.000</span>
  </div>

  <a href="https://wa.me/6282137358827?text=Saya%20mau%20beli%20merchandise%20Antisia" class="btn-wa" target="_blank">
    PURCHASE
  </a>

  <p style="font-size: 9px; color: #222; margin-top: 40px; letter-spacing: 8px; cursor: pointer;" onclick="goToDetails()">[ EXPLORE ]</p>
</div>

<!-- Grid & Viewer Script Sama Seperti Sebelumnya -->
<button class="btn-back" id="btnBack" onclick="goBack()">RETURN</button>
<div id="detail-grid">
  <div class="product-card" onclick="openViewer(0)"><img src="kaos_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(1)"><img src="kaos_belakang.jpg"></div>
  <div class="product-card" onclick="openViewer(2)"><img src="model_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(3)"><img src="model_belakang.jpg"></div>
</div>

<script>
  // Kursor Kustom Script
  const cursor = document.getElementById('custom-cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });

  // Fungsi Navigasi & Zoom (Gunakan script dari percakapan sebelumnya)
  const imgs = ["kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg"];
  function goToDetails() { document.getElementById('main-landing').style.display = 'none'; document.getElementById('detail-grid').style.display = 'grid'; document.getElementById('btnBack').style.display = 'inline-block'; }
  function goBack() { document.getElementById('main-landing').style.display = 'block'; document.getElementById('detail-grid').style.display = 'none'; document.getElementById('btnBack').style.display = 'none'; }
  // ... Tambahkan fungsi openViewer, closeViewer, dsb ...
</script>

</body>
</html>
