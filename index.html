<!DOCTYPE html>
<html>
<head>
    <title>Toko Acep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
#zoomModal {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  flex-direction: column;
  z-index:999;
}

#zoomedImg {
  max-width:80vw;
  max-height:80vh;
  transition: transform 0.1s;
  cursor: grab;
}

#controls button {
  padding:10px;
  margin:5px;
  font-size:18px;
}
</style>

</head>
<body>

<div class="container">

<h1>TOKO ACEP SURYA</h1>

<form method="GET">
    <input type="text" name="q" placeholder="Cari produk...">
    
    <select name="kategori">
        <option value="">Semua</option>
        <option value="kaos">Kaos</option>
        <option value="hoodie">Hoodie</option>
    </select>

    <button type="submit">Cari</button>
</form>

<div class="grid">

{% for p in produk %}
<div class="card">
    <img src="{{ url_for('static', filename=p.gambar[0]) }}"
         onclick="zoomImage(this)">
    
    <h3>{{ p.nama }}</h3>
    <p>{{ p.harga }}</p>

    <a href="/produk/{{ p.id }}">Lihat</a>
</div>
{% endfor %}

</div>

</div>

<!-- ZOOM MODAL -->
<div id="zoomModal">
  <img id="zoomedImg">

  <div id="controls">
    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">-</button>
    <button onclick="resetZoom()">RESET</button>
  </div>
</div>

<script>
let scale = 1;

function zoomImage(el){
  document.getElementById("zoomModal").style.display = "flex";
  document.getElementById("zoomedImg").src = el.src;
  scale = 1;
  update();
}

function zoomIn(){
  scale += 0.2;
  update();
}

function zoomOut(){
  scale -= 0.2;
  if(scale < 1) scale = 1;
  update();
}

function resetZoom(){
  scale = 1;
  update();
}

function update(){
  document.getElementById("zoomedImg").style.transform = "scale(" + scale + ")";
}

// SCROLL ZOOM
document.getElementById("zoomedImg").addEventListener("wheel", function(e){
  e.preventDefault();
  if(e.deltaY < 0){
    zoomIn();
  } else {
    zoomOut();
  }
});

// TUTUP MODAL
document.getElementById("zoomModal").onclick = function(e){
  if(e.target.id === "zoomModal"){
    this.style.display = "none";
  }
}
</script>

</body>
</html>
