<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:white;
  text-align:center;
}

h1{
  margin:20px;
}

.grid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  width:220px;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  background:red;
  color:white;
  cursor:pointer;
}

/* VIEWER */
#viewer{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

#zoomWrapper{
  width:90vw;
  height:80vh;
  overflow:hidden;
  position:relative;
  cursor:grab;
}

#viewerImg{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:center;
}

.nav{
  position:absolute;
  top:50%;
  font-size:40px;
  color:white;
  background:none;
  border:none;
  cursor:pointer;
  z-index:10;
}

.left{ left:20px; }
.right{ right:20px; }

.close{
  position:absolute;
  top:20px;
  right:20px;
  font-size:30px;
  cursor:pointer;
}

.zoom-control{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
}

.zoom-control button{
  margin:5px;
}
</style>

</head>
<body>

<h1>ANTISIA STORE</h1>

<div class="grid">

<div class="card">
<img src="kaos_depan.jpg" onclick="openViewer(0)">
<h3>Kaos Depan</h3>
<p>Rp 150.000</p>
</div>

<div class="card">
<img src="kaos_belakang.jpg" onclick="openViewer(1)">
<h3>Kaos Belakang</h3>
<p>Rp 150.000</p>
</div>

<div class="card">
<img src="model_depan.jpg" onclick="openViewer(2)">
<h3>Model Depan</h3>
<p>Rp 150.000</p>
</div>

<div class="card">
<img src="model_belakang.jpg" onclick="openViewer(3)">
<h3>Model Belakang</h3>
<p>Rp 150.000</p>
</div>

<div class="card">
<img src="detail.jpg" onclick="openViewer(4)">
<h3>Detail</h3>
<p>Rp 150.000</p>
</div>

</div>

<!-- POPUP VIEWER -->
<div id="viewer">
  <span class="close" onclick="closeViewer()">✕</span>

  <button class="nav left" onclick="prevImage()">◀</button>

  <div id="zoomWrapper">
    <img id="viewerImg">
  </div>

  <button class="nav right" onclick="nextImage()">▶</button>

  <div class="zoom-control">
    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">-</button>
  </div>
</div>

<script>
let images = [
"kaos_depan.jpg",
"kaos_belakang.jpg",
"model_depan.jpg",
"model_belakang.jpg",
"detail.jpg"
];

let current = 0;
let scale = 1;
let posX = 0;
let posY = 0;

let isDragging = false;
let startX, startY;

function openViewer(i){
  current = i;
  document.getElementById("viewer").style.display="flex";
  show();
}

function closeViewer(){
  document.getElementById("viewer").style.display="none";
}

function show(){
  let img = document.getElementById("viewerImg");
  img.src = images[current];
  scale = 1;
  posX = 0;
  posY = 0;
  updateTransform();
}

function nextImage(){
  current = (current+1)%images.length;
  show();
}

function prevImage(){
  current = (current-1+images.length)%images.length;
  show();
}

function zoomIn(){
  scale += 0.3;
  updateTransform();
}

function zoomOut(){
  scale -= 0.3;
  if(scale < 1) scale = 1;
  updateTransform();
}

function updateTransform(){
  let img = document.getElementById("viewerImg");
  img.style.transform =
    "translate(calc(-50% + " + posX + "px), calc(-50% + " + posY + "px)) scale(" + scale + ")";
}

// DRAG MOUSE
const wrapper = document.getElementById("zoomWrapper");

wrapper.addEventListener("mousedown", (e)=>{
  isDragging = true;
  startX = e.clientX - posX;
  startY = e.clientY - posY;
});

document.addEventListener("mouseup", ()=>{
  isDragging = false;
});

document.addEventListener("mousemove", (e)=>{
  if(isDragging){
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    updateTransform();
  }
});

// SCROLL ZOOM
wrapper.addEventListener("wheel", (e)=>{
  e.preventDefault();
  if(e.deltaY < 0){
    zoomIn();
  } else {
    zoomOut();
  }
});
</script>

</body>
</html>
