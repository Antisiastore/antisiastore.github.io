<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA - OFFICIAL STORE</title>

<style>
  /* 1. DASAR */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; }
  
  body {
    margin: 0; padding: 0;
    background: radial-gradient(circle, #111 0%, #000 100%);
    background-attachment: fixed;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    text-align: center;
    overflow-x: hidden;
  }

  /* 2. MARQUEE JUMBO */
  .marquee-container {
    background: #ffffff; color: #000; padding: 18px 0;
    font-size: 22px; font-weight: 900; letter-spacing: 5px;
    text-transform: uppercase; overflow: hidden; white-space: nowrap;
    position: fixed; top: 0; width: 100%; z-index: 3000; border-bottom: 3px solid #000;
  }
  .marquee-text {
    display: inline-block; padding-left: 100%;
    animation: marquee 20s linear infinite;
  }
  @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

  /* 3. LOGO STICKY (TANPA KOTAK PUTIH) */
  .logo-header { 
    padding: 15px; padding-top: 80px; 
    background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 2000;
  }
  .logo-header img { 
    max-width: 250px; width: 70%; height: auto; display: block; margin: 0 auto; 
    mix-blend-mode: screen; 
  }

  /* 4. HALAMAN UTAMA */
  #main-landing { padding: 40px 20px 100px 20px; }
  .status-tag { font-size: 10px; color: #ff0000; letter-spacing: 2px; margin-bottom: 15px; display: block; }
  .blink { animation: blinker 1s linear infinite; }
  @keyframes blinker { 50% { opacity: 0; } }

  .hero-img { max-width: 480px; width: 95%; border: 1px solid #222; cursor: pointer; transition: 0.4s; }
  .hero-img:hover { border-color: #ff0000; box-shadow: 0 0 30px rgba(255,0,0,0.2); }
  
  .price-tag { margin-top: 25px; margin-bottom: 25px; }
  .price-idr { font-size: 30px; font-weight: 900; letter-spacing: 8px; display: block; }

  .tech-specs {
    max-width: 400px; margin: 25px auto; padding: 15px;
    border: 1px dashed #333; font-size: 11px; color: #666;
    text-align: left; line-height: 1.8;
  }

  /* TOMBOL CHECK OUT DENGAN EFEK GETAR (GLITCH) */
  .btn-wa {
    display: inline-block; margin-top: 20px; background: transparent; color: #fff;
    padding: 18px 55px; text-decoration: none; border: 1px solid #fff;
    font-size: 13px; letter-spacing: 5px; text-transform: uppercase;
  }
  .btn-wa:hover { 
    background: #fff; color: #000; 
    animation: glitch 0.2s infinite; 
  }
  @keyframes glitch {
    0% { transform: translate(0); }
    25% { transform: translate(-3px, 3px); }
    50% { transform: translate(-3px, -3px); }
    75% { transform: translate(3px, 3px); }
    100% { transform: translate(3px, -3px); }
  }

  .explore-btn {
    display: block; font-size: 11px; color: #444; margin-top: 50px;
    letter-spacing: 10px; cursor: pointer; transition: 0.3s; text-transform: uppercase;
  }
  .explore-btn:hover { color: #fff; }

  /* 5. DETAIL GRID */
  #detail-grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; }
  .btn-back { display: none; background: none; border: none; color: #555; padding: 30px; cursor: pointer; font-size: 11px; letter-spacing: 6px; width:100%; }
  .product-card { background: #080808; border: 1px solid #151515; padding: 5px; cursor: pointer; }
  .product-card img { width: 100%; display: block; }

  /* 6. VIEWER ZOOM, DRAG & PANAH */
  #viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 10000; overflow: hidden; }
  .viewer-wrap { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
  #imgView { 
    max-width: 85%; max-height: 85vh; cursor: grab; user-select: none; position: absolute;
    transition: transform 0.1s ease-out;
  }
  #imgView:active { cursor: grabbing; }
  
  .ui-btn { position: fixed; background: none; border: none; color: #fff; font-size: 40px; cursor: pointer; z-index: 10001; padding: 20px; opacity: 0.5; transition: 0.3s;}
  .ui-btn:hover { opacity: 1; color: #ff0000; }
  .close-x { top: 10px; right: 10px; }
  .arrow-l { left: 0; top: 50%; transform: translateY(-50%); }
  .arrow-r { right: 0; top: 50%; transform: translateY(-50%); }

  @media (max-width: 600px) { #detail-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="marquee-container">
  <div class="marquee-text">
