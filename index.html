<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE - CATALOG</title>

<style>
  /* 1. DASAR & SCROLLBAR */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; }
  
  body {
    margin: 0; padding: 0;
    background: radial-gradient(circle, #111 0%, #000 100%);
    background-attachment: fixed;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    text-align: center;
  }

  /* 2. HEADER LOGO SALIB BARU (PUTIH & TRANSAPAREN) */
  .logo-header { 
    padding: 30px 20px;
    position: sticky; top: 0; 
    background: rgba(0,0,0,0.9); 
    backdrop-filter: blur(10px);
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .logo-header img { 
    max-width: 220px; width: 60%; height: auto; 
    display: block; margin: 0 auto;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); 
  }

  /* 3. GRID PRODUK (HALAMAN UTAMA) */
  #main-landing { 
    padding: 40px 15px; 
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 40px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .product-box { padding: 20px; transition: 0.3s; }

  .hero-img {
    width: 100%;
    border: 1px solid #222;
    cursor: pointer;
    transition: 0.4s;
  }
  .hero-img:hover { border-color: #fff; transform: translateY(-5px); }

  .price-tag { margin-top: 15px; }
  .price-idr { font-size: 20px; letter-spacing: 3px; display: block; font-weight: bold; }

  .btn-wa {
    display: inline-block;
    margin-top: 20px;
    background-color: transparent;
    color: #fff;
    padding: 12px 35px;
    text-decoration: none;
    border: 1px solid #333;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: 0.4s;
  }
  .btn-wa:hover { background: #fff; color: #000; border-color: #fff; }

  /* 4. DETAIL GRID & VIEWER (Fokus Produk) */
  #detail-grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; max-width: 900px; margin: 0 auto; }
  .btn-back { display: none; background: none; border: none; color: #444; padding: 20px; cursor: pointer; font-size: 10px; letter-spacing: 5px; }
  .product-card img { width: 100%; border: 1px solid #111; display: block; }
</style>
</head>
<body>

<div class="logo-header">
  <img src="logo_salib_transparent.png" alt="Antisia Cross Logo">
</div>

<div id="main-landing">
  
  <div class="product-box">
    <img src="kaos_depan.jpg" class="hero-img" onclick="goToDetails()">
    <div class="price-tag">
      <span class="price-idr">IDR 165.000</span>
    </div>
    <a href="https://wa.me/6282137358827?text=Saya%20mau%20beli%20kaos%20Antisia" class="btn-wa" target="_blank">CHECK OUT</a>
  </div>

</div>

<button class="btn-back" id="btnBack" onclick="goBack()">RETURN TO CATALOG</button>

<div id="detail-grid">
  <div class="product-card"><img src="kaos_depan.jpg"></div>
  <div class="product-card"><img src="kaos_belakang.jpg"></div>
</div>

<script>
  function goToDetails() {
    document.getElementById('main-landing').style.display = 'none';
    document.getElementById('detail-grid').style.display = 'grid';
    document.getElementById('btnBack').style.display = 'inline-block';
    window.scrollTo(0,0);
  }

  function goBack() {
    document.getElementById('main-landing').style.display = 'grid';
    document.getElementById('detail-grid').style.display = 'none';
    document.getElementById('btnBack').style.display = 'none';
  }
</script>

</body>
</html>
