<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA - DARK ELEGANCE</title>

<style>
  /* 1. SCROLLBAR MINIMALIS */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; }

  /* 2. BODY DENGAN EFEK VIGNETTE */
  body {
    margin: 0; padding: 0;
    background: radial-gradient(circle, #111 0%, #000 100%); /* Efek sorot lampu tengah */
    background-attachment: fixed;
    color: #fff;
    font-family: 'Courier New', Courier, monospace; /* Font mesin tik/tajam */
    text-align: center;
    overflow-x: hidden;
  }

  /* 3. HEADER RAMPING & LUX */
  .logo-header { 
    padding: 20px 0;
    position: sticky; top: 0; 
    background: rgba(0,0,0,0.95); 
    backdrop-filter: blur(15px);
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .logo-header img { 
    max-width: 220px; width: 60%; height: auto; 
    filter: drop-shadow(0 0 10px rgba(255,0,0,0.2)); /* Glow merah tipis di logo */
  }

  /* 4. MAIN LANDING DENGAN ANIMASI */
  #main-landing { padding: 60px 20px; opacity: 0; animation: fadeIn 2s forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .hero-container {
    position: relative;
    max-width: 450px; margin: 0 auto;
    cursor: pointer;
  }
  .hero-img {
    width: 100%;
    border: 1px solid #111;
    transition: 0.6s ease;
  }
  /* Efek saat gambar disentuh: Zoom sedikit & Border Merah */
  .hero-container:hover .hero-img {
    border-color: #ff0000;
    transform: scale(1.02);
  }

  /* TEXT HARGA ELEGANT */
  .price-tag { margin-top: 30px; }
  .price-idr { font-size: 22px; letter-spacing: 6px; font-weight: 300; display: block; }
  .price-usd { font-size: 12px; color: #444; display: block; margin-top: 8px; letter-spacing: 2px; }

  /* TOMBOL ORDER MINIMALIS */
  .btn-wa {
    display: inline-block;
    margin-top: 40px;
    background: transparent;
    color: #fff;
    padding: 15px 50px;
    text-decoration: none;
    border: 1px solid #333;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    transition: 0.5s;
  }
  .btn-wa:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
    box-shadow: 0 0 30px rgba(255,255,255,0.1);
  }

  .explore-btn {
    display: block; font-size: 9px; color: #222; margin-top: 40px; 
    letter-spacing: 8px; cursor: pointer; transition: 0.3s;
  }
  .explore-btn:hover { color: #ff0000; }

  /* 5. GRID DETAIL */
  #detail-grid {
    display: none; grid-template-columns: repeat(2, 1fr);
    gap: 10px; padding: 10px; max-width: 1000px; margin: 0 auto;
  }
  .btn-back {
    display: none; background: none; border: none; color: #444; 
    padding: 20px; cursor: pointer; font-size: 9px; letter-spacing: 5px;
  }
  .btn-back:hover { color: #fff; }

  .product-card { background: #000; border: 1px solid #111; padding: 5px; cursor: pointer; }
  .product-card img { width: 100%; filter: grayscale(50%); transition: 0.5s; }
  .product-card:hover img { filter: grayscale(0%); }

  /* 6. VIEWER ZOOM (TETAP STABIL) */
  #viewer {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: #000;
    z-index: 10000; overflow: hidden;
  }
  .viewer-wrap { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  #imgView { max-width: 90%; max-height: 80vh; transition: transform 0.1s ease-out; }
  .ui-btn { position: fixed; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; z-index: 10001; padding: 20px; opacity: 0.3; }
  .ui-btn:hover { opacity: 1; }
  .close-x { top: 10px; right: 10px; }
  .arrow-l { left: 0; top: 50%; transform: translateY(-50%); }
  .arrow-r { right: 0; top: 50%; transform: translateY(-50%); }

  @media (max-width: 500px) { #detail-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="logo-header">
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<div id="main-landing">
  <div class="hero-container" onclick="goToDetails()">
    <img src="kaos_depan.jpg" class="hero-img">
  </div>
  
  <div class="price-tag">
    <span class="price-idr">IDR 165.000</span>
    <span class="price-usd">11$ USD</span>
  </div>

  <!-- NOMOR HP SUDAH FIX kawan -->
  <a href="https://wa.me/6282137358827?text=Saya%20mau%20beli%20merchandise%20Antisia" class="btn-wa" target="_blank">
    PURCHASE ARTICLE
  </a>

  <span class="explore-btn" onclick="goToDetails()">[ VIEW DETAILS ]</span>
</div>

<button class="btn-back" id="btnBack" onclick="goBack()">RETURN TO GALLERY</button>
<div id="detail-grid">
  <div class="product-card" onclick="openViewer(0)"><img src="kaos_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(1)"><img src="kaos_belakang.jpg"></div>
  <div class="product-card" onclick="openViewer(2)"><img src="model_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(3)"><img src="model_belakang.jpg"></div>
</div>

<div id="viewer">
  <button class="ui-btn close-x" onclick="closeViewer()">✕</button>
  <button class="ui-btn arrow-l" onclick="prevImg()">‹</button>
  <button class="ui-btn arrow-r" onclick="nextImg()">›</button>
  <div class="viewer-wrap" id="dropzone">
    <img id="imgView" src="">
  </div>
</div>

<script>
  const imgs = ["kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg"];
  let currentIndex = 0;
  let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0, isDragging = false;

  function goToDetails() {
    document.getElementById('main-landing').style.display = 'none';
    document.getElementById('detail-grid').style.display = 'grid';
    document.getElementById('btnBack').style.display = 'inline-block';
    window.scrollTo(0,0);
  }

  function goBack() {
    document.getElementById('main-landing').style.display = 'block';
    document.getElementById('detail-grid').style.display = 'none';
    document.getElementById('btnBack').style.display = 'none';
  }

  function openViewer(index) {
    currentIndex = index;
    document.getElementById("viewer").style.display = "block";
    updateContent();
    document.body.style.overflow = "hidden";
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.body.style.overflow = "auto";
  }

  function updateContent() {
    scale = 1; pointX = 0; pointY = 0;
    document.getElementById("imgView").src = imgs[currentIndex];
    updateTransform();
  }

  function nextImg() { currentIndex = (currentIndex + 1) % imgs.length; updateContent(); }
  function prevImg() { currentIndex = (currentIndex - 1 + imgs.length) % imgs.length; updateContent(); }

  function updateTransform() {
    document.getElementById("imgView").style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
  }

  // Zoom & Drag Logic
  const viewer = document.getElementById("viewer");
  viewer.onwheel = function(e) {
    e.preventDefault();
    if (e.deltaY > 0) scale = Math.max(1, scale - 0.2);
    else scale = Math.min(5, scale + 0.2);
    updateTransform();
  }

  const dropzone = document.getElementById("dropzone");
  dropzone.onmousedown = function(e) {
    isDragging = true;
    startX = e.clientX - pointX;
    startY = e.clientY - pointY;
  }
  window.onmousemove = function(e) {
    if (!isDragging) return;
    pointX = e.clientX - startX;
    pointY = e.clientY - startY;
    updateTransform();
  }
  window.onmouseup = function() { isDragging = false; }
</script>

</body>
</html>
