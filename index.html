<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:white;
  text-align:center;
}

h1{margin:20px;}

.grid{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  width:90%;
  max-width:300px;
}

.card img{
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

/* VIEWER */
#viewer{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#viewer img{
  max-width:90%;
  max-height:70%;
}

.nav{
  position:absolute;
  top:50%;
  font-size:35px;
  background:none;
  border:none;
  color:white;
}

.left{left:10px;}
.right{right:10px;}

.close{
  position:absolute;
  top:20px;
  right:20px;
  font-size:30px;
}

.zoom{
  position:absolute;
  bottom:20px;
}
</style>

</head>
<body>

<h1>ANTISIA STORE</h1>

<div class="grid">

<img src="kaos_depan.jpg" onclick="openViewer(0)">
<img src="kaos_belakang.jpg" onclick="openViewer(1)">
<img src="model_depan.jpg" onclick="openViewer(2)">
<img src="model_belakang.jpg" onclick="openViewer(3)">
<img src="detail.jpg" onclick="openViewer(4)">

</div>

<div id="viewer">
<span class="close" onclick="closeViewer()">✕</span>

<button class="nav left" onclick="prev()">◀</button>
<img id="imgView">
<button class="nav right" onclick="next()">▶</button>

<div class="zoom">
<button onclick="zoomIn()">+</button>
<button onclick="zoomOut()">-</button>
</div>
</div>

<script>
let imgs=[
"kaos_depan.jpg",
"kaos_belakang.jpg",
"model_depan.jpg",
"model_belakang.jpg",
"detail.jpg"
];

let i=0;
let scale=1;

function openViewer(n){
i=n;
document.getElementById("viewer").style.display="flex";
show();
}

function closeViewer(){
document.getElementById("viewer").style.display="none";
}

function show(){
let img=document.getElementById("imgView");
img.src=imgs[i];
scale=1;
img.style.transform="scale(1)";
}

function next(){
i=(i+1)%imgs.length;
show();
}

function prev(){
i=(i-1+imgs.length)%imgs.length;
show();
}

function zoomIn(){
scale+=0.2;
document.getElementById("imgView").style.transform="scale("+scale+")";
}

function zoomOut(){
scale-=0.2;
if(scale<1) scale=1;
document.getElementById("imgView").style.transform="scale("+scale+")";
}
</script>

</body>
</html>
