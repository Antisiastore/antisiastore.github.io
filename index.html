<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE - CHECKOUT READY</title>

<style>
  body {
    margin: 0; padding: 0;
    background: #000; color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
  }

  .logo-header { padding: 40px 20px; }
  .logo-header img { max-width: 220px; height: auto; }

  /* --- HALAMAN 1: MAIN LANDING --- */
  #main-landing {
    padding: 20px;
    transition: transform 0.3s;
  }
  #main-landing img {
    max-width: 450px;
    width: 90%;
    border: 1px solid #222;
    cursor: pointer;
  }

  /* Styling Harga */
  .price-tag {
    margin-top: 15px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .price-idr { font-size: 20px; color: #fff; display: block; }
  .price-usd { font-size: 14px; color: #888; display: block; margin-top: 5px; }

  /* Tombol WhatsApp */
  .btn-wa {
    display: inline-block;
    margin-top: 25px;
    background-color: #25d366; /* Warna khas WA */
    color: #000;
    padding: 15px 30px;
    text-decoration: none;
    font-weight: bold;
    border-radius: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: 0.3s;
  }
  .btn-wa:hover {
    background-color: #128c7e;
    color: #fff;
  }

  .hint-text {
    font-size: 10px;
    letter-spacing: 3px;
    color: #444;
    margin-top: 15px;
    text-transform: uppercase;
    cursor: pointer;
  }

  /* --- HALAMAN 2: DETAIL GRID --- */
  #detail-grid {
    display: none;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
    max-width: 900px;
    margin: 0 auto;
  }
  .btn-back {
    display: none;
    background: none;
    border: 1px solid #444;
    color: #888;
    padding: 10px 20px;
    cursor: pointer;
    margin-bottom: 30px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .product-card {
    background: #0a0a0a;
    border: 1px solid #1a1a1a;
    padding: 10px;
    cursor: pointer;
  }
  .product-card img { width: 100%; display: block; }
  .product-card p { font-size: 9px; color: #555; margin-top: 10px; }

  /* --- POPUP VIEWER --- */
  #viewer {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.98);
    z-index: 10000;
    overflow: hidden;
    touch-action: none;
  }
  .viewer-wrap {
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    cursor: grab;
  }
  #imgView {
    max-width: 85%; max-height: 80vh;
    transition: transform 0.1s ease-out;
    transform-origin: center;
  }

  .ui-btn {
    position: fixed;
    background: rgba(255,255,255,0.05);
    border: none;
    color: #fff;
    font-size: 30px;
    cursor: pointer;
    z-index: 10001;
    padding: 15px;
  }
  .close-x { top: 20px; right: 20px; background: none; font-size: 40px; }
  .arrow-l { left: 10px; top: 50%; transform: translateY(-50%); }
  .arrow-r { right: 10px; top: 50%; transform: translateY(-50%); }

  @media (max-width: 500px) { #detail-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="logo-header">
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<!-- HALAMAN 1: LANDING DENGAN HARGA & WA -->
<div id="main-landing">
  <img src="kaos_depan.jpg" onclick="goToDetails()">
  
  <div class="price-tag">
    <span class="price-idr">IDR 165.000</span>
    <span class="price-usd">11$ USD</span>
  </div>

  <!-- Link WhatsApp dengan Pesan Otomatis -->
  <a href="https://wa.me/6282137359927?text=Saya%20mau%20beli%20merchandise%20Antisia" class="btn-wa" target="_blank">
    Buy via WhatsApp
  </a>

  <p class="hint-text" onclick="goToDetails()">Click Image for Details</p>
</div>

<!-- HALAMAN 2: GRID DETAIL -->
<button class="btn-back" id="btnBack" onclick="goBack()">◀ Back to Home</button>
<div id="detail-grid">
  <div class="product-card" onclick="openViewer(0)"><img src="kaos_depan.jpg"><p>FRONT VIEW</p></div>
  <div class="product-card" onclick="openViewer(1)"><img src="kaos_belakang.jpg"><p>BACK VIEW</p></div>
  <div class="product-card" onclick="openViewer(2)"><img src="model_depan.jpg"><p>LOOKBOOK 01</p></div>
  <div class="product-card" onclick="openViewer(3)"><img src="model_belakang.jpg"><p>LOOKBOOK 02</p></div>
</div>

<!-- POPUP ZOOM -->
<div id="viewer">
  <button class="ui-btn close-x" onclick="closeViewer()">✕</button>
  <button class="ui-btn arrow-l" onclick="prevImg()">‹</button>
  <button class="ui-btn arrow-r" onclick="nextImg()">›</button>
  <div class="viewer-wrap" id="dropzone">
    <img id="imgView" src="">
  </div>
</div>

<script>
  // Sama dengan kode sebelumnya, hanya fungsi navigasi & zoom tetap dipertahankan
  const imgs = ["kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg"];
  let currentIndex = 0;
  let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0, isDragging = false;

  function goToDetails() {
    document.getElementById('main-landing').style.display = 'none';
    document.getElementById('detail-grid').style.display = 'grid';
    document.getElementById('btnBack').style.display = 'inline-block';
  }

  function goBack() {
    document.getElementById('main-landing').style.display = 'block';
    document.getElementById('detail-grid').style.display = 'none';
    document.getElementById('btnBack').style.display = 'none';
  }

  function openViewer(index) {
    currentIndex = index;
    document.getElementById("viewer").style.display = "block";
    updateContent();
    document.body.style.overflow = "hidden";
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.body.style.overflow = "auto";
  }

  function updateContent() {
    scale = 1; pointX = 0; pointY = 0;
    document.getElementById("imgView").src = imgs[currentIndex];
    updateTransform();
  }

  function nextImg() { currentIndex = (currentIndex + 1) % imgs.length; updateContent(); }
  function prevImg() { currentIndex = (currentIndex - 1 + imgs.length) % imgs.length; updateContent(); }

  function updateTransform() {
    document.getElementById("imgView").style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
  }

  const viewer = document.getElementById("viewer");
  viewer.onwheel = function(e) {
    e.preventDefault();
    if (e.deltaY > 0) scale = Math.max(1, scale - 0.2);
    else scale = Math.min(5, scale + 0.2);
    updateTransform();
  }

  const dropzone = document.getElementById("dropzone");
  dropzone.onmousedown = function(e) {
    isDragging = true;
    startX = e.clientX - pointX;
    startY = e.clientY - pointY;
  }
  window.onmousemove = function(e) {
    if (!isDragging) return;
    pointX = e.clientX - startX;
    pointY = e.clientY - startY;
    updateTransform();
  }
  window.onmouseup = function() { isDragging = false; }
</script>

</body>
</html>
