<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA - OFFICIAL STORE</title>

<style>
  /* 1. DASAR */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; }
  
  body {
    margin: 0; padding: 0;
    background: radial-gradient(circle, #111 0%, #000 100%);
    background-attachment: fixed;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    text-align: center;
    overflow-x: hidden;
  }

  /* 2. UPDATE: MARQUEE JUMBO (Lebih Tinggi & Huruf Lebih Besar) */
  .marquee-container {
    background: #ffffff;
    color: #000000;
    padding: 18px 0;     /* Ukuran ke bawah diperbesar */
    font-size: 22px;     /* Huruf diperbesar signifikan */
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
    position: fixed;
    top: 0; width: 100%;
    z-index: 3000;
    border-bottom: 3px solid #000;
  }
  .marquee-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 20s linear infinite;
  }
  @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

  /* 3. UPDATE: LOGO STICKY & LEBIH BESAR */
  .logo-header { 
    padding: 30px;
    padding-top: 100px; /* Ditambah agar tidak tertutup marquee yang lebih tinggi */
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 2000;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .logo-header img { 
    max-width: 320px; /* Ukuran logo diperbesar kawan */
    width: 85%;       /* Menyesuaikan layar HP */
    height: auto; 
    display: block; 
    margin: 0 auto; 
  }

  /* 4. HALAMAN UTAMA */
  #main-landing { padding: 40px 20px; }
  .hero-img { max-width: 480px; width: 95%; border: 1px solid #222; cursor: pointer; transition: 0.4s; }
  .hero-img:hover { border-color: #ff0000; box-shadow: 0 0 30px rgba(255,0,0,0.2); }
  
  .price-tag { margin-top: 30px; }
  .price-idr { font-size: 30px; font-weight: 900; letter-spacing: 8px; display: block; }

  .btn-wa {
    display: inline-block; margin-top: 35px; background-color: transparent; color: #fff;
    padding: 18px 55px; text-decoration: none; border: 1px solid #333;
    font-size: 13px; letter-spacing: 5px; transition: 0.4s; text-transform: uppercase;
  }
  .btn-wa:hover { background: #fff; color: #000; }

  .explore-btn {
    display: block; font-size: 11px; color: #444; margin-top: 45px;
    letter-spacing: 10px; cursor: pointer; transition: 0.3s;
    text-transform: uppercase;
  }
  .explore-btn:hover { color: #fff; }

  /* 5. DETAIL GRID */
  #detail-grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; }
  .btn-back { display: none; background: none; border: none; color: #555; padding: 30px; cursor: pointer; font-size: 11px; letter-spacing: 6px; }
  .product-card { background: #080808; border: 1px solid #151515; padding: 5px; cursor: pointer; }
  .product-card img { width: 100%; display: block; }

  /* 6. VIEWER ZOOM & DRAG */
  #viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 10000; overflow: hidden; }
  .viewer-wrap { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
  #imgView { 
    max-width: 85%; max-height: 85vh; 
    cursor: grab; 
    user-select: none;
    position: absolute;
    transition: transform 0.1s ease-out;
  }
  #imgView:active { cursor: grabbing; }
  
  .ui-btn { position: fixed; background: none; border: none; color: #fff; font-size: 40px; cursor: pointer; z-index: 10001; padding: 20px; opacity: 0.5; }
  .ui-btn:hover { opacity: 1; color: #ff0000; }
  .close-x { top: 10px; right: 10px; }
  .arrow-l { left: 0; top: 50%; transform: translateY(-50%); }
  .arrow-r { right: 0; top: 50%; transform: translateY(-50%); }

  @media (max-width: 600px) { #detail-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="marquee-container">
  <div class="marquee-text">
    STREETWEAR WITHOUT APOLOGY — LIMITED RUN — WORLDWIDE SHIPPING — ANTISIA SUPPLY CO. — STREETWEAR WITHOUT APOLOGY
  </div>
</div>

<div class="logo-header">
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<div id="main-landing">
  <img src="kaos_depan.jpg" class="hero-img" onclick="goToDetails()">
  <div class="price-tag"><span class="price-idr">IDR 165.000</span></div>
  <a href="https://wa.me/6282137358827" class="btn-wa" target="_blank">CHECK OUT</a>
  <span class="explore-btn" onclick="goToDetails()">[ EXPLORE DETAILS ]</span>
</div>

<button class="btn-back" id="btnBack" onclick="goBack()">← RETURN TO CATALOG</button>

<div id="detail-grid">
  <div class="product-card" onclick="openViewer(0)"><img src="kaos_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(1)"><img src="kaos_belakang.jpg"></div>
  <div class="product-card" onclick="openViewer(2)"><img src="model_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(3)"><img src="model_belakang.jpg"></div>
</div>

<div id="viewer">
  <button class="ui-btn close-x" onclick="closeViewer()">✕</button>
  <button class="ui-btn arrow-l" onclick="prevImg()">‹</button>
  <button class="ui-btn arrow-r" onclick="nextImg()">›</button>
  <div class="viewer-wrap" id="dragContainer">
    <img id="imgView" src="">
  </div>
</div>

<script>
  const imgs = ["kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg"];
  let currentIndex = 0;
  let scale = 1;
  let isDragging = false;
  let startX, startY, translateX = 0, translateY = 0;

  function goToDetails() {
    document.getElementById('main-landing').style.display = 'none';
    document.getElementById('detail-grid').style.display = 'grid';
    document.getElementById('btnBack').style.display = 'inline-block';
    window.scrollTo(0,0);
  }

  function goBack() {
    document.getElementById('main-landing').style.display = 'block';
    document.getElementById('detail-grid').style.display = 'none';
    document.getElementById('btnBack').style.display = 'none';
  }

  function openViewer(index) {
    currentIndex = index;
    resetZoom();
    updateViewer();
    document.getElementById("viewer").style.display = "block";
    document.body.style.overflow = "hidden";
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.body.style.overflow = "auto";
  }

  function nextImg() { currentIndex = (currentIndex + 1) % imgs.length; resetZoom(); updateViewer(); }
  function prevImg() { currentIndex = (currentIndex - 1 + imgs.length) % imgs.length; resetZoom(); updateViewer(); }

  function resetZoom() {
    scale = 1; translateX = 0; translateY = 0;
  }

  function updateViewer() {
    const img = document.getElementById("imgView");
    img.src = imgs[currentIndex];
    img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  }

  const viewer = document.getElementById("viewer");
  viewer.onwheel = function(e) {
    e.preventDefault();
    if (e.deltaY > 0) scale = Math.max(1, scale - 0.2);
    else scale = Math.min(5, scale + 0.2);
    if (scale === 1) resetZoom();
    updateViewer();
  }

  viewer.onmousedown = (e) => {
    if (scale > 1) {
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    }
  };

  window.onmousemove = (e) => {
    if (!isDragging) return;
    translateX = e.clientX - startX;
    translateY = e.clientY - startY;
    updateViewer();
  };

  window.onmouseup = () => { isDragging = false; };

  document.addEventListener('keydown', (e) => {
    if (document.getElementById("viewer").style.display === "block") {
      if (e.key === "ArrowRight") nextImg();
      if (e.key === "ArrowLeft") prevImg();
      if (e.key === "Escape") closeViewer();
    }
  });
</script>

</body>
</html>
