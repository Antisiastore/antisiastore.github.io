<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
  /* 1. DASAR HALAMAN */
  body {
    margin: 0;
    padding: 0;
    background: #000000;
    color: #ffffff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    text-align: center;
  }

  /* 2. HEADER LOGO */
  .logo-header {
    padding: 60px 20px 40px 20px;
    display: flex;
    justify-content: center;
  }

  .logo-header img {
    max-width: 280px;
    height: auto;
    display: block;
  }

  /* 3. GRID PRODUK (2 KOLOM) */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Membagi layar jadi 2 kolom sama besar */
    gap: 20px;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto; /* Menaruh grid di tengah layar */
  }

  /* 4. KOTAK PRODUK (CARD) */
  .product-card {
    background: #0a0a0a;
    border: 1px solid #1a1a1a;
    padding: 15px;
    border-radius: 4px;
    transition: all 0.3s ease; /* Durasi animasi halus */
  }

  /* Efek saat kursor menyentuh produk */
  .product-card:hover {
    border-color: #ff0000; /* Border berubah merah khas Antisia */
    transform: translateY(-5px); /* Gambar sedikit naik ke atas */
  }

  .product-card img {
    width: 100%;
    height: auto;
    cursor: pointer;
    display: block;
    border-radius: 2px;
  }

  .product-card p {
    margin-top: 15px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888;
  }

  /* 5. RESPONSIVE (UNTUK HP KECIL) */
  @media (max-width: 500px) {
    .grid-container {
      grid-template-columns: 1fr; /* Jadi 1 kolom di HP kecil */
      gap: 15px;
    }
    .logo-header { padding: 40px 20px; }
  }

  /* 6. VIEWER POPUP (TETAP SAMA) */
  #viewer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.98);
    z-index: 999;
  }

  .viewer-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .viewer-wrap img {
    max-width: 95%;
    max-height: 85vh;
  }

  .nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    background: none;
    border: none;
    color: #444;
    cursor: pointer;
    padding: 20px;
  }

  .left { left: 5px; }
  .right { right: 5px; }

  .close {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 40px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- BAGIAN LOGO -->
<div class="logo-header">
  <img src="logo_antisia.png?v=1" alt="Antisia Logo">
</div>

<!-- BAGIAN GRID PRODUK -->
<div class="grid-container">
