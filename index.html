<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
body{
  margin:0;
  background:#0d0d0d;
  color:white;
  text-align:center;
  font-family:Arial;
}

h1{margin:20px;}

.grid{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  width:90%;
  max-width:320px;
}

.card img{
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

/* VIEWER */
#viewer{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:999;
}

/* WRAPPER (INI KUNCI) */
.viewer-wrap{
  width:100%;
  height:100%;
  overflow:auto;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* GAMBAR NORMAL */
.viewer-wrap img{
  max-width:100%;
  height:auto;
}

/* NAV */
.nav{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  font-size:30px;
  background:none;
  border:none;
  color:white;
}

.left{left:10px;}
.right{right:10px;}

.close{
  position:fixed;
  top:20px;
  right:20px;
  font-size:30px;
}
</style>

</head>
<body>

<h1>ANTISIA STORE</h1>

<div class="grid">
  <div class="card">
    <img src="kaos_depan.jpg" onclick="openViewer(0)">
    <p>Kaos Depan</p>
  </div>

  <div class="card">
    <img src="kaos_belakang.jpg" onclick="openViewer(1)">
    <p>Kaos Belakang</p>
  </div>

  <div class="card">
    <img src="model_depan.jpg" onclick="openViewer(2)">
    <p>Model Depan</p>
  </div>

  <div class="card">
    <img src="model_belakang.jpg" onclick="openViewer(3)">
    <p>Model Belakang</p>
  </div>

  <div class="card">
    <img src="detail.jpg" onclick="openViewer(4)">
    <p>Detail</p>
  </div>
</div>

<!-- VIEWER -->
<div id="viewer">

<button class="close" onclick="closeViewer()">✕</button>
<button class="nav left" onclick="prev()">◀</button>
<button class="nav right" onclick="next()">▶</button>

<div class="viewer-wrap">
  <img id="imgView">
</div>

</div>

<script>
let imgs=[
"kaos_depan.jpg",
"kaos_belakang.jpg",
"model_depan.jpg",
"model_belakang.jpg",
"detail.jpg"
];

let i=0;

function openViewer(n){
  i=n;
  document.getElementById("viewer").style.display="block";
  show();
}

function closeViewer(){
  document.getElementById("viewer").style.display="none";
}

function show(){
  document.getElementById("imgView").src=imgs[i];
}

function next(){
  i=(i+1)%imgs.length;
  show();
}

function prev(){
  i=(i-1+imgs.length)%imgs.length;
  show();
}
</script>

</body>
</html>
