<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
  /* 1. DASAR HALAMAN */
  body {
    margin: 0;
    padding: 0;
    background: #000000; /* Latar belakang hitam pekat */
    color: #ffffff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    text-align: center;
  }

  /* 2. HEADER LOGO SALIB (DIPERBAIKI) */
  .logo-header {
    padding: 80px 20px 60px 20px; /* Memberi ruang di atas dan bawah logo */
    display: flex;
    justify-content: center; /* Membuat logo salib berada tepat di tengah secara horizontal */
    align-items: center; /* Membuat logo berada di tengah secara vertikal jika ada tinggi ekstra */
  }

  .logo-header img {
    /* Mengatur ukuran logo kawan, sesuaikan max-width jika kurang besar/kecil */
    max-width: 250px; 
    height: auto;
    display: block;
    
    /* TIPS PRO: Jika warna salibnya terlalu gelap di background hitam, */
    /* kamu bisa hapus tanda komentar (//) di bawah ini untuk membuatnya lebih terang */
    // filter: brightness(1.2) contrast(1.1); 
  }
</style>
</head>
<body>

  <div class="logo-header">
    <img src="logo_salib_transparent.png" alt="Antisia Cross Logo">
  </div>

  <div style="padding: 20px; color: #444; font-size: 12px; letter-spacing: 2px;">
    COMIMG SOON / UNDER CONSTRUCTION
  </div>

</body>
</html>
