<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA - OFFICIAL SUPPLY CO.</title>

<style>
  /* 1. DASAR & ATMOSFER (Gaya Industrial) */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; }
  
  body {
    margin: 0; padding: 0;
    background: radial-gradient(circle, #111 0%, #000 100%);
    background-attachment: fixed;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    text-align: center;
    overflow-x: hidden;
  }

  /* 2. FITUR MARQUEE (Teks Berjalan Merah) */
  .marquee-container {
    background: #ff0000;
    color: #000;
    padding: 6px 0;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
    position: fixed;
    top: 0; width: 100%;
    z-index: 3000; /* Paling atas */
  }
  .marquee-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 20s linear infinite;
  }
  @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

  /* 3. FIX: LOGO STICKY LEBIH RAMPING & TANPA KOTAK PUTIH */
  .logo-header { 
    /* Jarak dari marquee, padding dipersempit kawan */
    padding: 20px 20px 5px 20px; 
    margin-top: 25px; 
    background: rgba(0,0,0,0.95);
    backdrop-filter: blur(10px);
    position: sticky; top: 0; 
    z-index: 2000;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .logo-header img { 
    max-width: 180px; /* Ukuran diperkecil kawan agar muat */
    width: 50%; height: auto; 
    display: block; margin: 0 auto;
    
    /* --- INI SIHIRNYA KAWAN: MENGHAPUS KOTAK PUTIH PADA LOGO BARUMU --- */
    mix-blend-mode: screen; 
  }

  /* 4. HALAMAN UTAMA (Main Landing) */
  #main-landing { padding: 30px 20px 60px 20px; animation: fadeIn 1.2s forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .hero-img { 
    max-width: 420px; width: 95%; 
    border: 1px solid #222; 
    cursor: pointer; 
    transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  }
  .hero-img:hover { border-color: #ff0000; box-shadow: 0 0 30px rgba(255,0,0,0.2); transform: translateY(-8px); }

  .price-tag { margin-top: 20px; }
  .price-idr { font-size: 24px; font-weight: 900; letter-spacing: 5px; display: block; }

  .btn-wa {
    display: inline-block; margin-top: 30px; background-color: transparent; color: #fff;
    padding: 12px 40px; text-decoration: none; border: 1px solid #333;
    font-size: 11px; letter-spacing: 4px; transition: 0.4s; text-transform: uppercase;
  }
  .btn-wa:hover { background: #fff; color: #000; border-color: #fff; }

  .explore-btn { 
    display: block; font-size: 9px; color: #333; margin-top: 35px; 
    letter-spacing: 7px; cursor: pointer; transition: 0.3s; text-transform: uppercase;
  }
  .explore-btn:hover { color: #fff; }

  /* 5. HALAMAN DETAIL (Grid 4 Gambar) */
  #detail-grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; max-width: 900px; margin: 0 auto; }
  .btn-back { display: none; background: none; border: none; color: #444; padding: 20px; cursor: pointer; font-size: 10px; letter-spacing: 5px; text-transform: uppercase;}
  .btn-back:hover { color: #fff; }

  .product-card { background: #080808; border: 1px solid #151515; padding: 5px; cursor: pointer; transition: 0.3s;}
  .product-card:hover { border-color: #ff0000; }
  .product-card img { width: 100%; display: block; }

  /* 6. POPUP VIEWER (Full Zoom) */
  #viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 10000; }
  .viewer-wrap { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  #imgView { max-width: 85%; max-height: 80vh; transition: transform 0.2s; border: 1px solid #222; }
  .ui-btn { position: fixed; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; z-index: 10001; padding: 20px; opacity: 0.6; }
  .ui-btn:hover { opacity: 1; }
  .close-x { top: 10px; right: 10px; }

  /* Responsive Mobile */
  @media (max-width: 600px) { #detail-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="marquee-container">
  <div class="marquee-text">STREETWEAR WITHOUT APOLOGY — LIMITED RUN — WORLDWIDE SHIPPING — ANTISIA SUPPLY CO.</div>
</div>

<div class="logo-header">
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<div id="main-landing">
  <img src="kaos_depan.jpg" class="hero-img" onclick="goToDetails()" title="Click for Details">
  <div class="price-tag">
    <span class="price-idr">IDR 165.000</span>
  </div>
  <a href="https://wa.me/6282137358827?text=Saya%20mau%20beli%20merchandise%20Antisia" class="btn-wa" target="_blank">CHECK OUT</a>
  <span class="explore-btn" onclick="goToDetails()">[ EXPLORE DETAILS ]</span>
</div>

<button class="btn-back" id="btnBack" onclick="goBack()">← BACK TO CATALOG</button>

<div id="detail-grid">
  <div class="product-card" onclick="openViewer(0)"><img src="kaos_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(1)"><img src="kaos_belakang.jpg"></div>
  <div class="product-card" onclick="openViewer(2)"><img src="model_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(3)"><img src="model_belakang.jpg"></div>
</div>

<div id="viewer">
  <button class="ui-btn close-x" onclick="closeViewer()">✕</button>
  <div class="viewer-wrap">
    <img id="imgView" src="">
  </div>
</div>

<script>
  // Array gambar untuk viewer
  const imgs = ["kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg"];

  // Fungsi navigasi halaman
  function goToDetails() {
    document.getElementById('main-landing').style.display = 'none';
    document.getElementById('detail-grid').style.display = 'grid';
    document.getElementById('btnBack').style.display = 'inline-block';
    window.scrollTo(0,0);
  }

  function goBack() {
    document.getElementById('main-landing').style.display = 'block';
    document.getElementById('detail-grid').style.display = 'none';
    document.getElementById('btnBack').style.display = 'none';
  }

  // Fungsi Zoom Viewer
  function openViewer(index) {
    document.getElementById("imgView").src = imgs[index];
    document.getElementById("viewer").style.display = "block";
    document.body.style.overflow = "hidden"; // Mencegah scroll background
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.body.style.overflow = "auto";
  }

  // Close viewer pakai tombol 'Escape' biar makin pro
  document.addEventListener('keydown', function(event) {
    if (event.key === "Escape") {
      closeViewer();
    }
  });
</script>

</body>
</html>
