<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
  /* 1. DASAR HALAMAN */
  body {
    margin: 0;
    padding: 0;
    background: #000000;
    color: #ffffff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
  }

  /* 2. HEADER LOGO */
  .logo-header {
    padding: 50px 20px;
    display: flex;
    justify-content: center;
  }

  .logo-header img {
    max-width: 250px;
    height: auto;
  }

  /* 3. GRID PRODUK (2 KOLOM) */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
    max-width: 900px;
    margin: 0 auto;
  }

  .product-card {
    background: #0a0a0a;
    border: 1px solid #1a1a1a;
    padding: 10px;
    transition: 0.3s;
    cursor: pointer;
  }

  .product-card:hover {
    border-color: #ff0000;
    transform: translateY(-5px);
  }

  .product-card img {
    width: 100%;
    display: block;
  }

  .product-card p {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #666;
  }

  /* 4. VIEWER POPUP (DIPERBAIKI) */
  #viewer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 10000; /* Pastikan berada paling atas */
  }

  .viewer-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #imgView {
    max-width: 90%;
    max-height: 80vh;
    border: 1px solid #333;
    background: #000; /* Mencegah area putih jika gambar belum muat */
  }

  /* Navigasi */
  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #fff;
    font-size: 40px;
    cursor: pointer;
    padding: 20px;
    z-index: 10001;
  }

  .btn-prev { left: 0; }
  .btn-next { right: 0; }

  .btn-close {
    position: fixed;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    color: #fff;
    font-size: 40px;
    cursor: pointer;
    z-index: 10001;
  }

  @media (max-width: 500px) {
    .grid-container { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="logo-header">
  <img src="logo_antisia.png" alt="Logo">
</div>

<div class="grid-container">
  <!-- Pastikan src gambar di bawah ini benar-benar ada di foldermu -->
  <div class="product-card" onclick="openViewer(0)">
    <img src="kaos_depan.jpg">
    <p>Front Side</p>
  </div>
  <div class="product-card" onclick="openViewer(1)">
    <img src="kaos_belakang.jpg">
    <p>Back Side</p>
  </div>
  <div class="product-card" onclick="openViewer(2)">
    <img src="model_depan.jpg">
    <p>Lookbook 01</p>
  </div>
  <div class="product-card" onclick="openViewer(3)">
    <img src="model_belakang.jpg">
    <p>Lookbook 02</p>
  </div>
</div>

<!-- VIEWER ELEMENT -->
<div id="viewer">
  <button class="btn-close" onclick="closeViewer()">✕</button>
  <button class="nav-btn btn-prev" onclick="prev()">◀</button>
  <button class="nav-btn btn-next" onclick="next()">▶</button>
  <div class="viewer-wrap">
    <img id="imgView" src="">
  </div>
</div>

<script>
  // DAFTAR GAMBAR: Pastikan nama file ini 100% sama dengan di foldermu
  const imgs = [
    "kaos_depan.jpg",
    "kaos_belakang.jpg",
    "model_depan.jpg",
    "model_belakang.jpg"
  ];

  let currentIndex = 0;

  function openViewer(index) {
    currentIndex = index;
    document.getElementById("viewer").style.display = "block";
    updateImage();
    // Mencegah scroll pada background
    document.body.style.overflow = "hidden";
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.body.style.overflow = "auto";
  }

  function updateImage() {
    const viewerImg = document.getElementById("imgView");
    // Menambahkan timestamp agar browser memuat ulang gambar
    viewerImg.src = imgs[currentIndex] + "?t=" + new Date().getTime();
  }

  function next() {
    currentIndex = (currentIndex + 1) % imgs.length;
    updateImage();
  }

  function prev() {
    currentIndex = (currentIndex - 1 + imgs.length) % imgs.length;
    updateImage();
  }

  // Menutup dengan tombol Escape
  window.addEventListener('keydown', (e) => {
    if (e.key === "Escape") closeViewer();
  });
</script>

</body>
</html>
