<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
  /* Dasar Halaman */
  body {
    margin: 0;
    background: #000000; /* Hitam pekat */
    color: white;
    text-align: center;
    font-family: 'Courier New', Courier, monospace;
  }

  /* --- BAGIAN LOGO (DIBERSIHKAN) --- */
  .logo-header {
    padding: 50px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .logo-header img {
    max-width: 280px; /* Sesuaikan lebar logo di sini */
    height: auto;
    display: block;
    /* Tidak perlu mix-blend-mode lagi karena file sudah transparan */
  }

  /* --- GRID PRODUK --- */
  .grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    padding: 20px;
  }

  .card {
    background: #111111;
    padding: 15px;
    border: 1px solid #222;
    width: 90%;
    max-width: 350px;
    border-radius: 4px;
  }

  .card img {
    width: 100%;
    cursor: pointer;
    display: block;
    border-radius: 2px;
  }

  .card p {
    margin-top: 15px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888;
  }

  /* --- VIEWER POPUP --- */
  #viewer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.98);
    z-index: 999;
  }

  .viewer-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .viewer-wrap img {
    max-width: 95%;
    max-height: 85vh;
  }

  /* Navigasi */
  .nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    background: none;
    border: none;
    color: #444;
    cursor: pointer;
    padding: 10px;
  }

  .left { left: 5px; }
  .right { right: 5px; }

  .close {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 40px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- Header Logo -->
<div class="logo-header">
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<!-- List Produk -->
<div class="grid">
  <div class="card">
    <img src="kaos_depan.jpg" onclick="openViewer(0)">
    <p>Front Article</p>
  </div>
  <div class="card">
    <img src="kaos_belakang.jpg" onclick="openViewer(1)">
    <p>Back Article</p>
  </div>
  <div class="card">
    <img src="model_depan.jpg" onclick="openViewer(2)">
    <p>Lookbook 01</p>
  </div>
  <div class="card">
    <img src="model_belakang.jpg" onclick="openViewer(3)">
    <p>Lookbook 02</p>
  </div>
  <div class="card">
    <img src="detail.jpg" onclick="openViewer(4)">
    <p>Details</p>
  </div>
</div>

<!-- Viewer -->
<div id="viewer">
  <button class="close" onclick="closeViewer()">✕</button>
  <button class="nav left" onclick="prev()">◀</button>
  <button class="nav right" onclick="next()">▶</button>
  <div class="viewer-wrap">
    <img id="imgView">
  </div>
</div>

<script>
  let imgs = ["kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg", "detail.jpg"];
  let i = 0;

  function openViewer(n) {
    i = n;
    document.getElementById("viewer").style.display = "block";
    show();
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
  }

  function show() {
    document.getElementById("imgView").src = imgs[i];
  }

  function next() {
    i = (i + 1) % imgs.length;
    show();
  }

  function prev() {
    i = (i - 1 + imgs.length) % imgs.length;
    show();
  }
</script>

</body>
</html>
