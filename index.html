<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 20px;
  letter-spacing: 3px;
}

.main-container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.main-image {
  width: 100%;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.3s;
}

.main-image:hover {
  transform: scale(1.03);
}

.thumbnails {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
}

.thumbnails img {
  width: 60px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.thumbnails img:hover {
  transform: scale(1.1);
  border: 2px solid red;
}

h2 {
  margin-top: 20px;
}

.price {
  margin: 10px 0;
  color: #ccc;
}

button {
  padding: 12px 25px;
  background: red;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
  border-radius: 5px;
  transition: 0.3s;
}

button:hover {
  background: darkred;
}

/* ZOOM MODAL */
#zoomModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#zoomedImg {
  max-width: 90%;
  max-height: 90%;
}
</style>

</head>
<body>

<h1>ANTISIA</h1>

<div class="main-container">

  <!-- GAMBAR UTAMA -->
  <img id="mainImg" src="kaos_depan.jpg" class="main-image"
  onclick="zoomImage(this)" ondblclick="zoomImage(this)">

  <!-- THUMBNAIL -->
  <div class="thumbnails">
    <img src="kaos_depan.jpg" onclick="changeImage(this)">
    <img src="kaos_belakang.jpg" onclick="changeImage(this)">
    <img src="model_depan.jpg" onclick="changeImage(this)">
    <img src="model_belakang.jpg" onclick="changeImage(this)">
    <img src="detail.jpg" onclick="changeImage(this)">
  </div>

  <h2>Kaos ANTISIA</h2>
  <div class="price">Rp 150.000</div>

  <!-- BUTTON WA -->
  <a href="https://wa.me/6282137358827?text=Halo%20saya%20mau%20pesan%20kaos%20ANTISIA" target="_blank">
    <button>BELI SEKARANG</button>
  </a>

</div>

<!-- ZOOM -->
<div id="zoomModal">
  <img id="zoomedImg">
</div>

<script>
// ZOOM IMAGE
function zoomImage(img) {
  document.getElementById("zoomModal").style.display = "flex";
  document.getElementById("zoomedImg").src = img.src;
}

// GANTI GAMBAR
function changeImage(img) {
  document.getElementById("mainImg").src = img.src;
}

// TUTUP ZOOM
document.getElementById("zoomModal").onclick = function() {
  this.style.display = "none";
}
</script>

</body>
</html>
