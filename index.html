<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA - OFFICIAL STORE</title>

<style>
  /* 1. DASAR & NOISE TEXTURE */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #333; }
  
  body {
    margin: 0; padding: 0;
    background: #000;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    text-align: center;
    overflow-x: hidden;
    cursor: none; /* Kita pakai kursor custom kawan */
  }

  /* Efek Grain/Noise biar tekstur web gahar */
  body::before {
    content: "";
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Noise_Texture.png');
    opacity: 0.05; pointer-events: none; z-index: 9999;
  }

  /* CUSTOM CURSOR */
  #custom-cursor {
    width: 20px; height: 20px;
    border: 1px solid #fff;
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 10000;
    transition: transform 0.15s ease, background 0.3s ease;
    mix-blend-mode: difference;
  }

  /* 2. MARQUEE JUMBO */
  .marquee-container {
    background: #ffffff;
    color: #000000;
    padding: 18px 0;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
    position: fixed;
    top: 0; width: 100%;
    z-index: 3000;
    border-bottom: 3px solid #000;
  }
  .marquee-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 20s linear infinite;
  }
  @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

  /* 3. LOGO STICKY RAMPING */
  .logo-header { 
    padding: 15px;
    padding-top: 80px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 2000;
  }
  .logo-header img { 
    max-width: 250px; width: 70%; height: auto; display: block; margin: 0 auto; 
    mix-blend-mode: screen; 
  }

  /* 4. HALAMAN UTAMA DENGAN REVEAL ANIMATION */
  #main-landing { padding: 40px 20px; opacity: 0; transform: translateY(30px); transition: 1s all ease; }
  #main-landing.active { opacity: 1; transform: translateY(0); }

  .status-tag { font-size: 10px; color: #ff0000; letter-spacing: 2px; margin-bottom: 15px; display: block; }
  .blink { animation: blinker 1s linear infinite; }
  @keyframes blinker { 50% { opacity: 0; } }

  .hero-img { 
    max-width: 480px; width: 95%; border: 1px solid #222; 
    cursor: none; transition: 0.6s; 
  }
  .hero-img:hover { border-color: #fff; filter: grayscale(100%) contrast(120%); }
  
  .price-tag { margin-top: 30px; }
  .price-idr { font-size: 30px; font-weight: 900; letter-spacing: 8px; display: block; }

  .tech-specs {
    max-width: 400px; margin: 25px auto; padding: 15px;
    border-left: 1px solid #333; font-size: 11px; color: #666;
    text-align: left; line-height: 1.8;
  }

  .btn-wa {
    display: inline-block; margin-top: 10px; background-color: transparent; color: #fff;
    padding: 18px 55px; text-decoration: none; border: 1px solid #333;
    font-size: 13px; letter-spacing: 5px; transition: 0.2s; text-transform: uppercase;
  }
  .btn-wa:hover { background: #fff; color: #000; animation: glitch 0.2s infinite; }
  @keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(2px, -2px); }
    100% { transform: translate(0); }
  }

  /* 5. DETAIL GRID */
  #detail-grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; }
  .btn-back { display: none; background: none; border: none; color: #555; padding: 30px; cursor: pointer; font-size: 11px; letter-spacing: 6px; }

  /* 6. VIEWER */
  #viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; overflow: hidden; }
  .viewer-wrap { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
  #imgView { max-width: 85%; max-height: 85vh; cursor: grab; position: absolute; transition: transform 0.1s ease-out; }
</style>
</head>
<body>

<!-- Kursor Custom -->
<div id="custom-cursor"></div>

<div class="marquee-container">
  <div class="marquee-text">
    ANTISIA SUPPLY CO. — STREETWEAR WITHOUT APOLOGY — LIMITED RUN — WORLDWIDE SHIPPING — ANTISIA SUPPLY CO.
  </div>
</div>

<div class="logo-header">
  <img src="logo_antisia.png" alt="Antisia Logo">
</div>

<div id="main-landing">
  <span class="status-tag"><span class="blink">●</span> STATUS: AVAILABLE</span>
  <img src="kaos_depan.jpg" class="hero-img" onclick="goToDetails()" onmouseover="expandCursor()" onmouseleave="shrinkCursor()">
  
  <div class="price-tag"><span class="price-idr">IDR 165.000</span></div>
  
  <div class="tech-specs">
    SERIAL NO: ANT-001/2026<br>
    FABRIC: HEAVY COTTON 24S<br>
    INK: PLASTISOL DOFF<br>
    TYPE: OVERSIZED CUT
  </div>

  <a href="https://wa.me/6282137358827" class="btn-wa" onmouseover="expandCursor()" onmouseleave="shrinkCursor()">CHECK OUT</a>
</div>

<!-- Grid Detail (Disembunyikan awalnya) -->
<button class="btn-back" id="btnBack" onclick="goBack()">← RETURN</button>
<div id="detail-grid">
  <div class="product-card" onclick="openViewer(0)"><img src="kaos_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(1)"><img src="kaos_belakang.jpg"></div>
  <div class="product-card" onclick="openViewer(2)"><img src="model_depan.jpg"></div>
  <div class="product-card" onclick="openViewer(3)"><img src="model_belakang.jpg"></div>
</div>

<!-- Viewer -->
<div id="viewer">
  <button style="position:fixed; top:20px; right:20px; color:white; background:none; border:none; font-size:30px; z-index:10002;" onclick="closeViewer()">✕</button>
  <div class="viewer-wrap" id="dragContainer">
    <img id="imgView" src="">
  </div>
</div>

<script>
  // ANIMASI MUNCUL (Reveal)
  window.onload = () => {
    document.getElementById('main-landing').classList.add('active');
  };

  // LOGIKA KURSOR CUSTOM
  const cursor = document.getElementById('custom-cursor');
  document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });

  function expandCursor() {
    cursor.style.transform = 'scale(4)';
    cursor.style.background = 'rgba(255,255,255,0.1)';
  }

  function shrinkCursor() {
    cursor.style.transform = 'scale(1)';
    cursor.style.background = 'transparent';
  }

  // LOGIKA NAVIGASI & VIEWER (Sama seperti sebelumnya)
  const imgs = ["kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg"];
  function goToDetails() {
    document.getElementById('main-landing').style.display = 'none';
    document.getElementById('detail-grid').style.display = 'grid';
    document.getElementById('btnBack').style.display = 'inline-block';
    window.scrollTo(0,0);
  }
  function goBack() {
    document.getElementById('main-landing').style.display = 'block';
    document.getElementById('detail-grid').style.display = 'none';
    document.getElementById('btnBack').style.display = 'none';
  }
  function openViewer(index) {
    document.getElementById("imgView").src = imgs[index];
    document.getElementById("viewer").style.display = "block";
  }
  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
  }
</script>

</body>
</html>
