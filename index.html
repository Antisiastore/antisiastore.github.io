<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
  /* Dasar Halaman - Hitam Total */
  body {
    margin: 0;
    background: #000000;
    color: white;
    text-align: center;
    font-family: 'Courier New', Courier, monospace;
  }

  /* --- BAGIAN LOGO --- */
  .logo-header {
    padding: 60px 20px;
    display: flex;
    justify-content: center;
    background: #000000;
  }

  .logo-header img {
    max-width: 320px; /* Ukuran bisa kamu sesuaikan */
    height: auto;
    display: block;
    /* Pastikan tidak ada filter yang mengganggu PNG transparan */
    mix-blend-mode: normal; 
  }

  /* --- GRID PRODUK --- */
  .grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 20px;
  }

  .card {
    background: #000000; /* Sama dengan background agar menyatu */
    padding: 10px;
    width: 90%;
    max-width: 400px;
  }

  .card img {
    width: 100%;
    cursor: pointer;
    display: block;
    /* Efek transisi halus saat diklik */
    transition: opacity 0.3s ease;
  }

  .card p {
    margin-top: 15px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555;
  }

  /* --- VIEWER POPUP --- */
  #viewer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 999;
  }

  .viewer-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .viewer-wrap img {
    max-width: 95%;
    max-height: 85vh;
  }

  .nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    background: none;
    border: none;
    color: #333;
    cursor: pointer;
  }

  .left { left: 10px; }
  .right { right: 10px; }

  .close {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 40px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="logo-header">
  <!-- Tips: Tambahkan ?v=1 di belakang nama file untuk memaksa browser memuat ulang -->
  <img src="logo_antisia.png?v=1" alt="Antisia Logo">
</div>

<div class="grid">
  <div class="card">
    <img src="kaos_depan.jpg?v=1" onclick="openViewer(0)">
    <p>Front Side</p>
  </div>
  <div class="card">
    <img src="kaos_belakang.jpg?v=1" onclick="openViewer(1)">
    <p>Back Side</p>
  </div>
  <!-- ... Tambahkan card lain jika perlu ... -->
</div>

<!-- Viewer popup tetap sama kodenya -->
<div id="viewer">
  <button class="close" onclick="closeViewer()">✕</button>
  <button class="nav left" onclick="prev()">◀</button>
  <button class="nav right" onclick="next()">▶</button>
  <div class="viewer-wrap">
    <img id="imgView">
  </div>
</div>

<script>
  let imgs = ["kaos_depan.jpg", "kaos_belakang.jpg", "model_depan.jpg", "model_belakang.jpg", "detail.jpg"];
  let i = 0;

  function openViewer(n) {
    i = n;
    document.getElementById("viewer").style.display = "block";
    show();
  }

  function closeViewer() {
    document.getElementById("viewer").style.display = "none";
  }

  function show() {
    document.getElementById("imgView").src = imgs[i] + "?v=1";
  }

  function next() {
    i = (i + 1) % imgs.length;
    show();
  }

  function prev() {
    i = (i - 1 + imgs.length) % imgs.length;
    show();
  }
</script>

</body>
</html>
