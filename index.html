<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE - OFFICIAL</title>

<style>
  /* 1. ATMOSPHERE DASAR */
  body {
    margin: 0; padding: 0;
    background: #000; /* Hitam pekat */
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    text-align: center;
  }

  /* 2. HEADER LOGO DENGAN FIX KOTAK PUTIH */
  .logo-header { 
    padding: 60px 20px;
    background: #000;
  }

  .logo-header img { 
    max-width: 250px; 
    width: 70%; 
    height: auto; 
    display: block; 
    margin: 0 auto;

    /* TRIK KHUSUS: Menghilangkan background putih pada gambar */
    /* 'multiply' akan membuat warna putih menjadi transparan pada background hitam */
    mix-blend-mode: lighten; 
    
    /* Tambahan agar logo lebih tajam */
    filter: contrast(1.2) brightness(1.1);
  }

  /* 3. KATALOG PRODUK */
  #main-landing { 
    padding: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .coming-soon {
    color: #444;
    font-size: 10px;
    letter-spacing: 5px;
    margin-top: 20px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="logo-header">
  <!-- Nama file harus sama dengan yang ada di foldermu kawan -->
  <img src="logo_salib_transparent.png" alt="Antisia Logo">
</div>

<div id="main-landing">
  <p class="coming-soon">COMING SOON / UNDER CONSTRUCTION</p>
</div>

</body>
</html>
