<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTISIA STORE</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:white;
  text-align:center;
}

h1 {
  margin:20px;
}

.grid {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.card {
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  width:220px;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.05);
}

.card img {
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

button {
  margin-top:10px;
  padding:10px;
  border:none;
  background:red;
  color:white;
  cursor:pointer;
}

#viewer {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

#viewer img {
  max-width:80vw;
  max-height:80vh;
  transition:transform 0.2s;
}

.nav {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:white;
  background:none;
  border:none;
  cursor:pointer;
}

.left { left:20px; }
.right { right:20px; }

.close {
  position:absolute;
  top:20px;
  right:20px;
  font-size:30px;
  cursor:pointer;
}

.controls {
  margin-top:10px;
}
</style>

</head>
<body>

<h1>ANTISIA STORE</h1>

<div class="grid">

<div class="card">
<img src="kaos_depan.jpg" onclick="openViewer(0)">
<h3>Kaos Depan</h3>
<p>Rp 150.000</p>
<a href="https://wa.me/628XXXXXXXXXX?text=Pesan%20Kaos%20ANTISIA">
<button>BELI</button></a>
</div>

<div class="card">
<img src="kaos_belakang.jpg" onclick="openViewer(1)">
<h3>Kaos Belakang</h3>
<p>Rp 150.000</p>
<a href="https://wa.me/628XXXXXXXXXX?text=Pesan%20Kaos%20ANTISIA">
<button>BELI</button></a>
</div>

<div class="card">
<img src="model_depan.jpg" onclick="openViewer(2)">
<h3>Model Depan</h3>
<p>Rp 150.000</p>
<a href="https://wa.me/628XXXXXXXXXX?text=Pesan%20Kaos%20ANTISIA">
<button>BELI</button></a>
</div>

<div class="card">
<img src="model_belakang.jpg" onclick="openViewer(3)">
<h3>Model Belakang</h3>
<p>Rp 150.000</p>
<a href="https://wa.me/628XXXXXXXXXX?text=Pesan%20Kaos%20ANTISIA">
<button>BELI</button></a>
</div>

<div class="card">
<img src="detail.jpg" onclick="openViewer(4)">
<h3>Detail</h3>
<p>Rp 150.000</p>
<a href="https://wa.me/628XXXXXXXXXX?text=Pesan%20Kaos%20ANTISIA">
<button>BELI</button></a>
</div>

</div>

<!-- VIEWER -->
<div id="viewer">
<span class="close" onclick="closeViewer()">✕</span>

<button class="nav left" onclick="prevImage()">◀</button>

<img id="viewerImg">

<button class="nav right" onclick="nextImage()">▶</button>

<div class="controls">
<button onclick="zoomIn()">+</button>
<button onclick="zoomOut()">-</button>
</div>
</div>

<script>
let images = [
"kaos_depan.jpg",
"kaos_belakang.jpg",
"model_depan.jpg",
"model_belakang.jpg",
"detail.jpg"
];

let current = 0;
let scale = 1;

function openViewer(i){
current = i;
document.getElementById("viewer").style.display="flex";
show();
}

function closeViewer(){
document.getElementById("viewer").style.display="none";
}

function show(){
let img = document.getElementById("viewerImg");
img.src = images[current];
scale = 1;
update();
}

function nextImage(){
current = (current+1)%images.length;
show();
}

function prevImage(){
current = (current-1+images.length)%images.length;
show();
}

function zoomIn(){
scale+=0.2;
update();
}

function zoomOut(){
scale-=0.2;
if(scale<1) scale=1;
update();
}

function update(){
document.getElementById("viewerImg").style.transform="scale("+scale+")";
}

document.getElementById("viewerImg").addEventListener("wheel", function(e){
e.preventDefault();
if(e.deltaY<0){zoomIn()}else{zoomOut()}
});
</script>

</body>
</html>
